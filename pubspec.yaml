name: newcare
description: NewCare nursing center — adaptive operational workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  file_saver: ^0.7.0
  timezone: ^0.11.2
  cupertino_icons: ^2.0.0
  lucide_icons_flutter: ^4.0.1
  skeletonizer: ^3.0.0
  shimmer: ^4.0.0
  device_preview: ^3.0.0
  crypt: ^4.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/newcare-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/newcare-icon.png
  web:
    generate: true
    image_path: assets/branding/newcare-icon.png
    background_color: "#FFFFFF"
    theme_color: "#16466B"
  windows:
    generate: true
    image_path: assets/branding/newcare-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/newcare-icon.png

